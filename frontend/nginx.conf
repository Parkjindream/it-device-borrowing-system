# nginx ทำ 2 หน้าที่พร้อมกัน:
# 1) เสิร์ฟไฟล์ frontend (html/css/js) เป็นเว็บสถิต
# 2) proxy คำขอ /api/, /admin/, /static/, /media/ ไปยัง backend (Django)
# ผลคือ frontend กับ backend อยู่ origin เดียวกันจากมุมมองเบราว์เซอร์ -> ไม่มีปัญหา CORS เลย
# (ต่างจากตอนพัฒนาบนเครื่อง ที่รันคนละพอร์ตจึงต้องพึ่ง CORS_ALLOWED_ORIGINS)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10M;   # เผื่ออัปโหลดรูปอุปกรณ์ขนาดใหญ่

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ไฟล์ static ของ Django/DRF/Admin (มาจาก collectstatic ผ่าน volume ที่ backend เขียนไว้)
    location /static/ {
        alias /usr/share/nginx/html/django-static/;
    }

    # รูปอุปกรณ์ที่เจ้าหน้าที่อัปโหลดผ่านหน้าเว็บ (มาจาก volume media_data ที่ backend เขียนไว้)
    location /media/ {
        alias /usr/share/nginx/html/django-media/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ไฟล์รูป/ฟอนต์ cache ยาวหน่อยได้ ลดโหลดซ้ำ
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
