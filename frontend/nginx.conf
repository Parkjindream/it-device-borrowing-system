# nginx ทำ 2 หน้าที่พร้อมกัน:
# 1) เสิร์ฟไฟล์ frontend (html/css/js) เป็นเว็บสถิต
# 2) proxy /api/* ไปยัง backend (Django) โดยตัด /api ออก เช่น /api/auth/login/ -> backend /auth/login/
#    (หน้า admin ของ Django จึงอยู่ที่ /api/admin/) — backend ไม่มีทางเข้าอื่นนอกจากนี้
#    ส่วน /static/ nginx เสิร์ฟเองจาก volume และ /media/ ดึงจาก MinIO ไม่ผ่าน Django
# ผลคือ frontend กับ backend อยู่ origin เดียวกันจากมุมมองเบราว์เซอร์ -> ไม่มีปัญหา CORS เลย
# (ต่างจากตอนพัฒนาบนเครื่อง ที่รันคนละพอร์ตจึงต้องพึ่ง CORS_ALLOWED_ORIGINS)

# ส่งต่อ scheme เดิมที่ผู้ใช้เข้ามา (https) จาก Cloudflare Tunnel ไปให้ Django
# ถ้าไม่มี header นี้ (เข้าตรงจาก localhost) ค่อยใช้ scheme ของ nginx เอง
# ไม่งั้น Django จะคิดว่าเป็น http แล้วสร้างลิงก์รูป http:// ทำให้เบราว์เซอร์บล็อก (mixed content)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10M;   # เผื่ออัปโหลดรูปอุปกรณ์ขนาดใหญ่

    # proxy_pass ลงท้ายด้วย / = แทน /api/ ด้วย / ก่อนส่งต่อ (ตัด prefix ออก)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ไฟล์ static ของ Django/DRF/Admin (มาจาก collectstatic ผ่าน volume ที่ backend เขียนไว้)
    # ^~ = ใช้ block นี้เลย ไม่ให้ block regex รูป/ฟอนต์ด้านล่างแย่งไป (ไม่งั้น .png/.svg ใต้ /static/ จะ 404)
    location ^~ /static/ {
        alias /usr/share/nginx/html/django-static/;
    }

    # รูปที่ผู้ใช้อัปโหลด (รูปอุปกรณ์/รูปโปรไฟล์) เก็บใน MinIO bucket "media"
    # /media/equipment/a.jpg -> http://minio:9000/media/equipment/a.jpg (path ตรงกับ bucket พอดี ไม่ต้องตัดอะไร)
    # bucket เปิดให้อ่านทีละไฟล์ได้อย่างเดียว (ensure_media_bucket) และที่นี่รับแค่ GET/HEAD
    location ^~ /media/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://minio:9000;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ไฟล์รูป/ฟอนต์ cache ยาวหน่อยได้ ลดโหลดซ้ำ
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
