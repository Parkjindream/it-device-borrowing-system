<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cc2a6c">
<title>หน้าหลักนักศึกษา — ศูนย์ยืม-คืนอุปกรณ์ไอที</title>
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="preload" href="../assets/fonts/anuphan-thai-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="antialiased">

<!-- ===== Header ===== -->
<header class="site-header">
  <div class="max-w-6xl mx-auto px-3 sm:px-6 h-16 sm:h-[68px] flex items-center justify-between gap-2 sm:gap-4">
    <a href="../index.html" class="brand flex-1 min-w-0" aria-label="กลับไปหน้าแรก">
      <img src="../assets/img/logo.png" alt="" class="brand-logo" width="42" height="42">
      <span class="min-w-0">
        <span class="brand-name"><span class="hidden sm:inline">ศูนย์ยืมคืนอุปกรณ์ไอที</span><span class="sm:hidden">ยืมคืนอุปกรณ์</span></span>
        <span class="brand-sub">หน้าหลักนักศึกษา</span>
      </span>
    </a>
    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
      <img id="navbar-avatar" alt="รูปโปรไฟล์" class="hidden w-10 h-10 rounded-full object-cover avatar-ring">
      <button id="open-profile-btn" class="btn btn-ghost !min-h-[42px] !py-1.5 !px-0 w-[42px] sm:w-auto sm:!px-5 text-sm whitespace-nowrap" aria-label="โปรไฟล์"><svg class="w-[19px] h-[19px] sm:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span class="hidden sm:inline">โปรไฟล์</span></button>
      <button id="logout-btn" class="btn btn-outline-navy !min-h-[42px] !py-1.5 !px-0 w-[42px] sm:w-auto sm:!px-5 text-sm whitespace-nowrap" aria-label="ออกจากระบบ"><svg class="w-[19px] h-[19px] sm:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="hidden sm:inline">ออกจากระบบ</span></button>
    </div>
  </div>
</header>

<div id="suspended-banner" class="hidden text-sm text-center py-3 px-4"></div>

<main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8">

  <h1 class="sr-only">หน้าหลักนักศึกษา</h1>
  <span id="welcome-text" class="hidden"></span>

  <!-- ===== Tabs ===== -->
  <div id="tab-bar" class="mb-6 sm:mb-8" role="tablist">
    <button data-tab="borrow" class="tab-btn px-4 sm:px-5 py-3 text-sm font-display border-b-2 border-[var(--navy)] text-[var(--navy)]">ยืมอุปกรณ์</button>
    <button data-tab="history" class="tab-btn px-4 sm:px-5 py-3 text-sm font-display border-b-2 border-transparent text-[var(--ink)]/55">ประวัติการยืมของฉัน</button>
  </div>

  <!-- ===== Tab: ยืมอุปกรณ์ ===== -->
  <section id="tab-borrow">
    <div class="flex flex-col sm:flex-row gap-3 mb-6">
      <div class="relative flex-1">
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-[var(--rose-400)] pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search-input" type="text" placeholder="ค้นหาชื่ออุปกรณ์..." class="input !pl-12">
      </div>
      <select id="category-select" class="input sm:!w-60" aria-label="หมวดหมู่อุปกรณ์">
        <option value="">ทุกหมวดหมู่</option>
      </select>
    </div>
    <div id="equipment-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5"></div>
    <p id="equipment-empty" class="hidden text-center text-sm text-[var(--ink)]/55 py-16">ไม่พบอุปกรณ์ที่ตรงกับคำค้นหา</p>
  </section>

  <!-- ===== Tab: ประวัติการยืม ===== -->
  <section id="tab-history" class="hidden">
    <div class="flex justify-end mb-4">
      <button id="clear-my-history-btn" class="btn btn-outline-navy !min-h-[40px] !py-1.5 !px-4 text-sm">ล้างประวัติเก่าของฉัน</button>
    </div>
    <div id="booking-list" class="space-y-3"></div>
    <p id="booking-empty" class="hidden text-center text-sm text-[var(--ink)]/55 py-16">ยังไม่มีประวัติการยืม</p>
  </section>
</main>

<!-- ===== Modal: จองอุปกรณ์ ===== -->
<div id="booking-modal" class="modal-backdrop hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-5">
  <div class="modal-sheet p-5 sm:p-6 w-full sm:max-w-md">
    <div class="rounded-2xl overflow-hidden mb-4 bg-gradient-to-br from-[var(--rose-50)] to-white border border-[var(--rose-100)]" style="aspect-ratio: 16/9;">
      <img id="modal-equipment-image" src="" alt="" class="w-full h-full object-contain p-2">
    </div>
    <h3 class="modal-title mb-1" id="modal-equipment-name"></h3>
    <p class="text-sm text-[var(--ink)]/60 mb-3" id="modal-equipment-meta"></p>
    <div id="modal-equipment-specs-wrap" class="hidden mb-5 rounded-xl bg-[var(--rose-50)] border border-[var(--rose-100)] px-4 py-3">
      <p class="text-xs font-semibold text-[var(--rose-700)] mb-1">สเปกอุปกรณ์</p>
      <p id="modal-equipment-specs" class="text-sm text-[var(--ink)]/80 max-h-32 overflow-y-auto" style="white-space: pre-line;"></p>
    </div>

    <div id="modal-error" class="hidden alert alert-error mb-4"></div>

    <form id="booking-form">
      <input type="hidden" name="equipment_id">
      <label class="field">
        <span class="field-label">วันเริ่มยืม</span>
        <input type="date" name="start_date" required class="input">
      </label>
      <label class="field !mb-6">
        <span class="field-label">วันครบกำหนดคืน</span>
        <input type="date" name="end_date" required class="input">
        <p id="modal-duration-summary" class="hint"></p>
      </label>
      <div class="flex flex-col-reverse sm:flex-row gap-3">
        <button type="button" id="modal-cancel-btn" class="btn btn-outline-navy flex-1">ยกเลิก</button>
        <button type="submit" id="modal-submit-btn" class="btn btn-primary flex-1">ยืนยันจอง</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== Modal: โปรไฟล์ของฉัน ===== -->
<div id="profile-modal" class="modal-backdrop hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-5">
  <div class="modal-sheet p-5 sm:p-6 w-full sm:max-w-md">
    <h3 class="modal-title mb-5">โปรไฟล์ของฉัน</h3>

    <div id="profile-tab-info" class="flex gap-2 mb-5 border-b border-[var(--line)]">
      <button type="button" data-profile-tab="edit" class="profile-tab-btn px-3 py-2.5 text-sm border-b-2 -mb-px border-[var(--navy)] text-[var(--navy)]">แก้ไขข้อมูล</button>
      <button type="button" data-profile-tab="password" class="profile-tab-btn px-3 py-2.5 text-sm border-b-2 -mb-px border-transparent text-[var(--ink)]/55">เปลี่ยนรหัสผ่าน</button>
    </div>

    <!-- แก้ไขชื่อ-นามสกุล/รหัสนักศึกษา/รูปโปรไฟล์ -->
    <form id="profile-form">
      <div id="profile-error" class="hidden alert alert-error mb-4"></div>
      <div id="profile-success" class="hidden alert alert-success mb-4"></div>

      <div class="field text-center">
        <span class="field-label">รูปโปรไฟล์</span>
        <label for="profile-image-input" id="profile-image-dropzone"
          class="flex flex-col items-center justify-center gap-1 w-24 h-24 rounded-full border-2 border-dashed border-[var(--rose-300)] cursor-pointer bg-[var(--rose-50)] overflow-hidden mx-auto">
          <svg id="profile-image-placeholder-icon" class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="var(--rose-400)" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
          <img id="profile-image-preview" class="hidden w-full h-full object-cover" alt="ตัวอย่างรูปโปรไฟล์">
        </label>
        <input type="file" name="profile_image" accept="image/*" id="profile-image-input" class="hidden">
        <p class="hint">คลิกที่วงกลมเพื่อเลือกรูป</p>
      </div>

      <label class="field">
        <span class="field-label">อีเมล (แก้ไขไม่ได้ — ติดต่อเจ้าหน้าที่หากต้องเปลี่ยน)</span>
        <input id="profile-email-display" type="text" disabled class="input">
      </label>
      <label class="field">
        <span class="field-label">ชื่อ</span>
        <input type="text" name="first_name" required class="input">
      </label>
      <label class="field">
        <span class="field-label">นามสกุล</span>
        <input type="text" name="last_name" class="input">
      </label>
      <label class="field !mb-6">
        <span class="field-label">รหัสนักศึกษา</span>
        <input type="text" name="student_id" placeholder="กรอกถ้ายังไม่มีในระบบ" class="input">
      </label>
      <div class="flex flex-col-reverse sm:flex-row gap-3">
        <button type="button" id="profile-modal-close" class="btn btn-outline-navy flex-1">ปิด</button>
        <button type="submit" id="profile-submit-btn" class="btn btn-primary flex-1">บันทึก</button>
      </div>
    </form>

    <!-- เปลี่ยนรหัสผ่าน -->
    <form id="password-form" class="hidden">
      <div id="password-error" class="hidden alert alert-error mb-4"></div>
      <div id="password-success" class="hidden alert alert-success mb-4"></div>

      <label class="field">
        <span class="field-label">รหัสผ่านปัจจุบัน</span>
        <input type="password" name="old_password" required class="input">
      </label>
      <label class="field !mb-6">
        <span class="field-label">รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</span>
        <input type="password" name="new_password" required minlength="8" class="input">
      </label>
      <div class="flex flex-col-reverse sm:flex-row gap-3">
        <button type="button" id="password-modal-close" class="btn btn-outline-navy flex-1">ปิด</button>
        <button type="submit" class="btn btn-primary flex-1">เปลี่ยนรหัสผ่าน</button>
      </div>
    </form>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth-guard.js"></script>
<script src="../assets/js/student-dashboard.js"></script>
<script src="../assets/js/ui.js" defer></script>
</body>
</html>
