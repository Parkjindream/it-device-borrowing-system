<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ลืมรหัสผ่าน — ศูนย์ยืม-คืนอุปกรณ์ไอที</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .pw-spin { animation: pw-rot .8s linear infinite; }
  @keyframes pw-rot { to { transform: rotate(360deg); } }
  .pw-pop { animation: pw-pop .45s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes pw-pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .pw-draw { stroke-dasharray: 40; stroke-dashoffset: 40; animation: pw-draw .45s .2s ease-out forwards; }
  @keyframes pw-draw { to { stroke-dashoffset: 0; } }
  .pw-bar { transform-origin: left; animation: pw-bar 5s linear forwards; }
  @keyframes pw-bar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  .pw-meter span { height: 4px; border-radius: 999px; background: var(--line); transition: background .25s; }
  @media (prefers-reduced-motion: reduce) { .pw-spin, .pw-pop, .pw-draw, .pw-bar { animation: none !important; stroke-dashoffset: 0; } }
</style>
</head>
<body class="antialiased min-h-screen flex flex-col" style="background: linear-gradient(160deg, var(--navy) 0%, var(--navy-dark) 100%);">

<div id="api-status-banner"></div>

<div class="flex-1 flex items-center justify-center px-5 py-12">
  <div class="w-full max-w-sm">

    <div class="text-center mb-8">
      <a href="index.html">
        <img src="assets/img/logo.png" alt="โลโก้ศูนย์ยืม-คืนอุปกรณ์ไอที" class="w-16 h-16 mx-auto mb-4">
      </a>
      <h1 class="font-display font-semibold text-white text-xl">ลืมรหัสผ่าน</h1>
      <p class="text-white/60 text-sm mt-1">กรอกอีเมลที่ลงทะเบียนไว้ เราจะส่งลิงก์ตั้งรหัสผ่านใหม่ให้</p>
    </div>

    <form id="forgot-form" class="surface rounded-2xl p-7 shadow-2xl" novalidate>
      <div id="form-message" class="hidden mb-4 text-sm rounded-lg px-3 py-2.5" style="background:#fdecec;color:#c33c3c;" role="alert" aria-live="assertive"></div>

      <label class="block mb-5">
        <span class="text-sm font-medium text-[var(--ink)]">อีเมล</span>
        <input id="email" type="email" name="email" required autocomplete="email" inputmode="email" maxlength="254"
          class="mt-1.5 w-full rounded-lg border border-[var(--line)] px-3.5 py-2.5 text-sm focus:border-[var(--navy)] focus:ring-1 focus:ring-[var(--navy)] outline-none"
          placeholder="student@example.ac.th">
      </label>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-block inline-flex items-center justify-center gap-2">
        <svg id="spin" class="pw-spin hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg><span id="btn-text">ส่งลิงก์ตั้งรหัสผ่านใหม่</span>
      </button>
    </form>

    <div id="sent-box" class="hidden surface rounded-2xl p-7 shadow-2xl text-center" role="status">
      <div class="pw-pop w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4" style="background:#e8eefb;color:var(--navy);">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/></svg>
      </div>
      <h2 class="font-display font-semibold text-lg text-[var(--ink)]">ตรวจสอบอีเมลของคุณ</h2>
      <p class="text-sm text-[var(--ink)]/65 mt-1.5">หากอีเมล <b id="sent-email" class="break-all"></b> มีอยู่ในระบบ เราได้ส่งลิงก์ตั้งรหัสผ่านไปให้แล้ว (ดูในกล่องสแปมด้วย)</p>
      <button id="resend-btn" type="button" class="btn btn-outline-navy btn-block mt-5" disabled></button>
    </div>

    <p class="text-center mt-6">
      <a href="login.html" class="text-white/60 text-sm hover:text-white">← กลับไปหน้าเข้าสู่ระบบ</a>
    </p>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const form = $("forgot-form"), email = $("email"), btn = $("submit-btn"), msg = $("form-message");
  let busy = false, timer = null, lastEmail = "";

  function showError(t) { msg.textContent = t; msg.classList.remove("hidden"); }
  function setLoading(on) {
    btn.disabled = on;
    $("spin").classList.toggle("hidden", !on);
    $("btn-text").textContent = on ? "กำลังส่ง..." : "ส่งลิงก์ตั้งรหัสผ่านใหม่";
  }
  // ตอบข้อความเหมือนกันเสมอ (backend ไม่เปิดเผยว่าอีเมลนี้มีในระบบหรือไม่)
  const send = (address) => Api.post("/auth/password-reset/", { email: address }, { auth: false });

  function startCooldown() {
    const resend = $("resend-btn");
    let left = 60;
    resend.disabled = true;
    resend.textContent = "ส่งอีกครั้งได้ใน " + left + " วินาที";
    clearInterval(timer);
    timer = setInterval(() => {
      left--;
      if (left <= 0) { clearInterval(timer); resend.disabled = false; resend.textContent = "ส่งลิงก์อีกครั้ง"; }
      else resend.textContent = "ส่งอีกครั้งได้ใน " + left + " วินาที";
    }, 1000);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (busy) return;
    msg.classList.add("hidden");
    const value = email.value.trim().toLowerCase();
    if (!value || !email.checkValidity()) { showError("กรุณากรอกอีเมลให้ถูกต้อง"); return email.focus(); }

    busy = true; setLoading(true);
    const { ok, status, data } = await send(value);
    busy = false; setLoading(false);

    if (ok) {
      lastEmail = value;
      $("sent-email").textContent = value;
      form.classList.add("hidden");
      $("sent-box").classList.remove("hidden");
      startCooldown();
    } else if (status === 429) {
      showError("ขอลิงก์บ่อยเกินไป กรุณารอสักครู่แล้วลองใหม่");
    } else if (data && data.email) {
      showError([].concat(data.email).join(" "));
    } else {
      showError((data && data.detail) || "ส่งไม่สำเร็จ กรุณาลองใหม่อีกครั้ง");
    }
  });

  $("resend-btn").addEventListener("click", async () => {
    if (busy || !lastEmail) return;
    busy = true;
    const b = $("resend-btn"); b.disabled = true; b.textContent = "กำลังส่ง...";
    const { ok, status } = await send(lastEmail);
    busy = false;
    if (ok) { startCooldown(); return; }
    b.disabled = false;
    b.textContent = status === 429 ? "ขอบ่อยเกินไป ลองใหม่ภายหลัง" : "ส่งไม่สำเร็จ ลองอีกครั้ง";
  });
})();
</script>
</body>
</html>
