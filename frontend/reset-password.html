<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตั้งรหัสผ่านใหม่ — ศูนย์ยืม-คืนอุปกรณ์ไอที</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="antialiased min-h-screen flex items-center justify-center px-5 py-12" style="background: linear-gradient(160deg, var(--navy) 0%, var(--navy-dark) 100%);">

<div class="w-full max-w-sm">
  <div class="text-center mb-8">
    <a href="index.html"><img src="assets/img/logo.png" alt="โลโก้" class="w-16 h-16 mx-auto mb-4"></a>
    <h1 class="font-display font-semibold text-white text-xl">ตั้งรหัสผ่านใหม่</h1>
    <p class="text-white/60 text-sm mt-1">กรอกรหัสผ่านใหม่ที่ต้องการใช้</p>
  </div>

  <form id="reset-form" class="surface rounded-2xl p-7 shadow-2xl">
    <div id="form-message" class="hidden mb-4 text-sm rounded-lg px-3 py-2.5"></div>

    <label class="block mb-4">
      <span class="text-sm font-medium text-[var(--ink)]">รหัสผ่านใหม่</span>
      <input type="password" name="new_password" required minlength="8" autocomplete="new-password"
        class="mt-1.5 w-full rounded-lg border border-[var(--line)] px-3.5 py-2.5 text-sm focus:border-[var(--navy)] focus:ring-1 focus:ring-[var(--navy)] outline-none"
        placeholder="อย่างน้อย 8 ตัวอักษร">
    </label>

    <label class="block mb-5">
      <span class="text-sm font-medium text-[var(--ink)]">ยืนยันรหัสผ่านใหม่</span>
      <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password"
        class="mt-1.5 w-full rounded-lg border border-[var(--line)] px-3.5 py-2.5 text-sm focus:border-[var(--navy)] focus:ring-1 focus:ring-[var(--navy)] outline-none"
        placeholder="กรอกอีกครั้งให้ตรงกัน">
    </label>

    <button type="submit" id="submit-btn" class="btn btn-primary btn-block">ตั้งรหัสผ่านใหม่</button>
  </form>

  <p class="text-center mt-6">
    <a href="login.html" class="text-white/60 text-sm hover:text-white">← กลับไปหน้าเข้าสู่ระบบ</a>
  </p>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/reset-password.js"></script>
</body>
</html>
