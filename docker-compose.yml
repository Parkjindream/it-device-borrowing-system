# ================================================================
# ระบบยืม-คืนอุปกรณ์ไอที — docker-compose สำหรับ deploy จริง
# ================================================================
# ใช้งาน:
#   1) cp .env.docker.example .env   แล้วแก้ค่าในไฟล์ .env ให้ครบ (ดูคอมเมนต์ในไฟล์)
#   2) docker compose up -d --build
#      (สร้างตารางในฐานข้อมูล + บัญชีแอดมินจาก DJANGO_SUPERUSER_* ให้อัตโนมัติ)
#   3) ดู URL สาธารณะของเว็บ (สุ่มใหม่ทุกครั้งที่ container cloudflared เริ่มใหม่):
#        docker compose logs cloudflared | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com'
#      ในเครื่องเซิร์ฟเวอร์เองเข้าได้ที่ http://localhost/ (พอร์ตตาม HTTP_PORT)
#
# ทางเข้าจากอินเทอร์เน็ตมีทางเดียวคือ Cloudflare Quick Tunnel (service "cloudflared", ไม่ต้องมีบัญชี/token)
#   ผู้ใช้ -> Cloudflare -> cloudflared -> frontend (nginx) -> /api/* -> backend
# ไม่ต้องเปิดพอร์ต/ทำ port forward ที่ router และไม่ต้องทำใบรับรอง https เอง
#
# เครื่องมือฐานข้อมูล (เปิดเฉพาะในเครื่องเซิร์ฟเวอร์ — จากเครื่องอื่นใช้ ssh -L):
#   pgAdmin      http://localhost:5050   (PGADMIN_PORT)
#   PostgreSQL   localhost:5433          (DB_EXPOSE_PORT) สำหรับ psql/DBeaver
#   สำรองข้อมูล   ./backups ทุกวัน         (วิธีกู้คืนดูใน db/backup.sh)
#
# services ทั้งหมดอยู่ในเครือข่ายเดียวกัน (docker network) เรียกหากันด้วยชื่อ service
# (backend เรียก db ว่า "db", frontend เรียก backend ว่า "backend" — ตั้งไว้ใน nginx.conf แล้ว)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-it_lending_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?กรุณาตั้งค่า DB_PASSWORD ในไฟล์ .env}
      TZ: Asia/Bangkok
    volumes:
      - pgdata:/var/lib/postgresql/data
    # เปิดให้ต่อจากเครื่องเซิร์ฟเวอร์เองเท่านั้น (ใช้ 5433 กันชนกับ PostgreSQL ที่ลงไว้ในเครื่องสำหรับพัฒนา)
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-it_lending_db}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # เตรียมฐานข้อมูลครั้งเดียวแล้วจบ: migrate + สร้างบัญชีแอดมินจาก DJANGO_SUPERUSER_* (ถ้ายังไม่มี)
  # backend/scheduler รอตัวนี้เสร็จก่อน กัน migrate พร้อมกัน 2 ตัวชนกันตอนฐานข้อมูลยังว่าง
  migrate:
    build: ./backend
    restart: "no"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate"]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      USE_X_FORWARDED_PROTO: "true"
      # proxy หน้า Django มี 2 ชั้น: cloudflared + nginx (ใช้อ่าน IP จริงของผู้ใช้ไว้จำกัดความถี่ login)
      NUM_PROXIES: "2"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8000"

  # งานอัตโนมัติ (no-show, แจ้งเตือนอีเมล, ปลดพักสิทธิ์) — แยก container ต่างหาก
  # รันคนละโปรเซสจากเว็บ กันงานพื้นหลังไปแย่ง worker ที่ใช้ตอบ request หน้าเว็บ
  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media
    command: ["python", "manage.py", "run_scheduler"]

  # สำรองฐานข้อมูลทุกวันลง ./backups บนเครื่อง ลบไฟล์ที่เก่าเกิน BACKUP_KEEP_DAYS วันอัตโนมัติ
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-it_lending_db}
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Bangkok
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./db/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

  # หน้าเว็บจัดการฐานข้อมูล — มีเซิร์ฟเวอร์ "it-lending" ตั้งไว้ให้แล้ว ใส่แค่รหัสผ่าน DB_PASSWORD ตอนเปิดครั้งแรก
  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?กรุณาตั้งค่า PGADMIN_PASSWORD ในไฟล์ .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # ผูกพอร์ตไว้แค่ localhost — คนภายนอกต้องเข้าผ่าน Cloudflare Tunnel เท่านั้น
    # (ถ้าเปิดให้เข้าตรง ๆ ได้ จะปลอม header Host/X-Forwarded-For/Proto ได้)
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    volumes:
      - static_data:/usr/share/nginx/html/django-static:ro
      - media_data:/usr/share/nginx/html/django-media:ro

  # Cloudflare Quick Tunnel (trycloudflare.com) — ไม่ต้องมีบัญชี/token ได้ URL https สุ่มมาให้
  # เหมาะกับทดลอง/สาธิต: URL เปลี่ยนทุกครั้งที่ container นี้เริ่มใหม่ และไม่มีการรับประกัน uptime
  # ใช้จริงระยะยาวให้เปลี่ยนเป็น tunnel แบบมี token (ผูกโดเมนตัวเอง):
  #   command: ["tunnel", "--no-autoupdate", "run"]  +  environment: TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://frontend:80"]
    depends_on:
      - frontend

configs:
  pgadmin_servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "it-lending",
            "Group": "Servers",
            "Host": "db",
            "Port": 5432,
            "MaintenanceDB": "${DB_NAME:-it_lending_db}",
            "Username": "${DB_USER:-postgres}",
            "SSLMode": "prefer"
          }
        }
      }

volumes:
  pgdata:
  media_data:
  static_data:
  pgadmin_data:
