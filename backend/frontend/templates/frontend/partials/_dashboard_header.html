{% load static %}
{# ใช้ร่วมกันระหว่าง staff/student dashboard — ส่ง container (ความกว้าง) และ role มาตอน include #}
<header class="site-header">
  <div class="{{ container }} mx-auto px-3 sm:px-6 h-16 sm:h-[68px] flex items-center justify-between gap-2 sm:gap-4">
    <a href="{% url 'frontend:home' %}" class="brand flex-1 min-w-0" aria-label="กลับไปหน้าแรก">
      <img src="{% static 'frontend/img/logo.png' %}" alt="" class="brand-logo" width="42" height="42">
      <span class="min-w-0">
        {% if role == "staff" %}
        <span class="brand-name"><span class="hidden sm:inline">แผงควบคุมเจ้าหน้าที่</span><span class="sm:hidden">แผงควบคุม</span></span>
        <span class="role-pill mt-0.5">เจ้าหน้าที่</span>
        {% else %}
        <span class="brand-name"><span class="hidden sm:inline">ศูนย์ยืมคืนอุปกรณ์ไอที</span><span class="sm:hidden">ยืมคืนอุปกรณ์</span></span>
        <span class="brand-sub">หน้าหลักนักศึกษา</span>
        {% endif %}
      </span>
    </a>
    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
      <img id="navbar-avatar" alt="รูปโปรไฟล์" class="hidden w-10 h-10 rounded-full object-cover avatar-ring">
      <button id="open-profile-btn" class="btn btn-ghost !min-h-[42px] !py-1.5 !px-0 w-[42px] sm:w-auto sm:!px-5 text-sm whitespace-nowrap" aria-label="โปรไฟล์"><svg class="w-[19px] h-[19px] sm:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span class="hidden sm:inline">โปรไฟล์</span></button>
      <button id="logout-btn" class="btn btn-outline-navy !min-h-[42px] !py-1.5 !px-0 w-[42px] sm:w-auto sm:!px-5 text-sm whitespace-nowrap" aria-label="ออกจากระบบ"><svg class="w-[19px] h-[19px] sm:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="hidden sm:inline">ออกจากระบบ</span></button>
    </div>
  </div>
</header>
