  # [ปิดไว้ก่อน — เปิดใช้: ลบ # หน้าบรรทัดของ service นี้ + "configs:" และ "pgadmin_data:" ท้ายไฟล์
  #  แล้วใส่ PGADMIN_EMAIL / PGADMIN_PASSWORD ใน .env]
  # หน้าเว็บจัดการฐานข้อมูล http://localhost:5050 — มีเซิร์ฟเวอร์ "it-lending" ตั้งไว้ให้แล้ว
  # ใส่แค่รหัสผ่าน DB_PASSWORD ตอนเปิดครั้งแรก
